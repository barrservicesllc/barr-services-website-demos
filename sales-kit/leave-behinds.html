<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barr Services QR Leave-Behinds</title><style>*{box-sizing:border-box}body{margin:0;background:#bbb;font-family:Arial,sans-serif;color:#171717}.sheet{width:8.5in;height:11in;margin:18px auto;background:#fff;padding:.62in;display:flex;flex-direction:column;page-break-after:always;box-shadow:0 5px 30px #0004;overflow:hidden}.brand{font-weight:950;letter-spacing:.12em;border-bottom:4px solid #171717;padding-bottom:18px}.brand span{float:right;color:#777;font-size:.7rem;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 2.35in;gap:.45in;align-items:center;flex:1}.kicker{font-size:.76rem;letter-spacing:.18em;font-weight:900;color:#a65332;margin:0 0 18px}h1{font:700 48px/1 Georgia,serif;margin:0 0 24px}.lead{font-size:20px;line-height:1.55;color:#484848}.scan{margin-top:32px;font-weight:900;font-size:18px}.url{margin-top:10px;font-size:11px;line-height:1.4;word-break:break-all;color:#666}.qr{display:grid;place-items:center;border:1px solid #ddd;padding:18px}.qr img{width:100%;height:auto}.bottom{border-top:1px solid #ccc;padding-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:30px;font-size:13px;line-height:1.6}.note{color:#777}@media print{body{background:white}.sheet{margin:0;box-shadow:none}}@page{size:letter;margin:0}</style></head><body><main id="pages"></main><script>const P=[

["Butcher Block Antiques","https://barrservicesllc.github.io/barr-services-website-demos/demos/butcher-block-antiques/","Turn browsing and discovery into a reason to physically visit the store."]];const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const pages=document.getElementById('pages');P.forEach(([name,url,angle])=>{const s=document.createElement('section');s.className='sheet';s.innerHTML=`<div class="brand">BARR SERVICES <span>LOCAL BUSINESS WEB DEMO</span></div><div class="grid"><div><p class="kicker">I ALREADY BUILT A CONCEPT FOR</p><h1>${esc(name)}</h1><p class="lead">${esc(angle)}</p><p class="scan">Scan the QR code to open the live demo.</p><div class="url">${esc(url)}</div></div><div class="qr"><img alt="QR code for ${esc(name)} demo" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=10&data=${encodeURIComponent(url)}"></div></div><div class="bottom"><div><strong>Devon • Barr Services</strong><br>barrservicesllc@gmail.com<br>Phone/text: ____________________</div><div class="note">This is a prospect demo, not an official business website unless the featured business approves it.</div></div>`;pages.appendChild(s)});</script></body></html>
